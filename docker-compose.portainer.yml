name: yoleotard-crm
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [crm_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [crm_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    extra_hosts:
      - "chatwoot.yoleotard.com:${CHATWOOT_HOST_IP:-192.168.31.219}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      OWNER_DISPLAY_NAME: ${OWNER_DISPLAY_NAME:-Yoleotard Owner}
      WEB_ORIGIN: ${WEB_ORIGIN}
      API_PORT: 4500
      UPLOADS_DIR: /app/uploads
      BACKUP_STORAGE_PATH: /backups
      ALLOW_RESTORE: ${ALLOW_RESTORE:-false}
    command: >
      sh -c "pnpm --filter @yoleotard-crm/database exec prisma migrate deploy --schema prisma/schema.prisma
      && pnpm --filter @yoleotard-crm/database seed
      && pnpm --filter @yoleotard-crm/api start"
    ports: ["${API_PUBLIC_PORT:-4500}:4500"]
    volumes:
      - crm_uploads:/app/uploads
      - ${BACKUP_STORAGE_PATH:-/home/trio/yoleotard-crm-backups}:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:4500/api/health | grep -q ''"ok":true''',
        ]
      interval: 15s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL}"
        CRM_VERSION: "${CRM_VERSION:-0.1.32}"
        CRM_COMMIT: "${CRM_COMMIT:-development}"
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["${WEB_PUBLIC_PORT:-3500}:3500"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3500 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 15
volumes:
  crm_postgres:
  crm_redis:
  crm_uploads:

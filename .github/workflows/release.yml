name: CRM release

on:
  push:
    tags:
      - "crm-v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and prepare notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#crm-v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Yoleotard CRM v${GITHUB_REF_NAME#crm-v}" --notes-file release-notes.md

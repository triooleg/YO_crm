name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @yoleotard-crm/database exec prisma validate --schema prisma/schema.prisma
      - run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.backup-test.yml config --quiet
      - run: pnpm quality:check

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Спортсмен и замеры — варианты</title><link rel="stylesheet" href="../themes/default.css"><style>
*{box-sizing:border-box}body{margin:0;padding-top:57px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans)}button,input,select{font:inherit}button{cursor:pointer;transition:.15s}.variants{position:fixed;z-index:20;inset:0 0 auto;display:flex;gap:8px;padding:9px 16px;border-bottom:1px solid var(--color-border);background:#fff}.variants button{padding:9px 14px;border:0;border-radius:8px;background:#f4f1f6;color:#655d70}.variants button.active{background:var(--color-primary);color:#fff}.screen{min-height:calc(100vh - 57px);display:grid;grid-template-columns:64px 220px 1fr}.nav{padding:16px 10px;background:#fff;border-right:1px solid var(--color-border)}.nav b{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--color-primary);color:#fff}.clients{background:#fff;border-right:1px solid var(--color-border)}.search{margin:14px;width:calc(100% - 28px);padding:10px;border:1px solid var(--color-border);border-radius:9px}.person{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid #f0ecf2}.person.active{background:var(--color-accent)}.avatar{display:grid;place-items:center;min-width:38px;height:38px;border-radius:50%;background:#e9e0ff;color:var(--color-primary);font-weight:800}.person span{display:grid}.person small,.muted{color:var(--color-text-muted)}.main{padding:25px}.card{max-width:1050px;margin:auto;border:1px solid var(--color-border);border-radius:16px;background:#fff;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--color-border)}.head h1{margin:0;font-size:25px}.primary{padding:10px 15px;border:0;border-radius:9px;background:var(--color-primary);color:#fff;font-weight:700}.content{padding:22px 24px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact,.athlete{padding:14px;border-radius:11px;background:#faf8fb}.fact{display:grid;gap:5px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}.section-title h2{margin:0;font-size:16px}.link{border:0;background:transparent;color:var(--color-primary);font-weight:700}.athlete{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.tag{padding:5px 9px;border-radius:99px;background:#eaf8f0;color:var(--color-success);font-size:12px}.drawer{overflow:auto;position:fixed;z-index:15;top:57px;right:0;width:min(480px,100%);height:calc(100vh - 57px);padding:25px;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:.22s}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between}.drawer h2{margin:0}.close{border:0;background:transparent;font-size:25px}.notice{margin:18px 0;padding:12px;border-radius:9px;background:var(--color-accent);color:#5637aa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px;margin-top:12px;font-size:13px;font-weight:650}.field input,.field select{width:100%;padding:10px;border:1px solid #ddd5e4;border-radius:9px}.measure-hint{display:flex;justify-content:space-between;gap:10px;margin:15px 0;color:var(--color-text-muted);font-size:12px}.required span{color:#5c36d4}.measurements-grid .field span{min-height:32px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.secondary{padding:9px 14px;border:1px solid var(--color-border);border-radius:9px;background:#fff}.inline-form{display:none;margin:8px 0 18px;padding:18px;border:1px solid #dacff6;border-radius:12px;background:#fcfaff}.inline-form.open{display:block}.modal-wrap{display:none;position:fixed;z-index:16;inset:57px 0 0;background:#211a2daa;place-items:center}.modal-wrap.open{display:grid}.modal{width:min(540px,calc(100% - 30px));padding:24px;border-radius:16px;background:#fff}.steps{display:flex;gap:8px;margin:14px 0}.step{flex:1;height:5px;border-radius:5px;background:#e9e3ed}.step.on{background:var(--color-primary)}.wizard-2{display:none}.toast{position:fixed;z-index:40;left:50%;bottom:24px;padding:11px 16px;border-radius:9px;background:#211a2d;color:#fff;transform:translate(-50%,100px);transition:.2s}.toast.show{transform:translate(-50%,0)}.variant{display:none}.variant.active{display:block}.tools{position:fixed;z-index:50;right:12px;bottom:12px;padding:8px;border-radius:8px;background:#000b;color:#fff;opacity:.45}.tools:hover{opacity:1}.tools button{border:0;background:transparent;color:#fff}@media(max-width:760px){.screen{grid-template-columns:64px 1fr}.clients{display:none}.main{padding:12px}.facts{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.variants{overflow:auto}.variants button{white-space:nowrap}}
</style></head><body><div class="variants"><button class="active" onclick="show('a',this)">A: Боковая панель ★ Выбрано</button><button onclick="show('b',this)">B: Внутри карточки</button><button onclick="show('c',this)">C: По шагам</button></div>
<div id="a" class="variant active"><div class="screen"><aside class="nav"><b>Y</b></aside><clientlist-x></clientlist-x><appcard-x mode="drawer"></appcard-x></div></div>
<div id="b" class="variant"><div class="screen"><aside class="nav"><b>Y</b></aside><clientlist-x></clientlist-x><appcard-x mode="inline"></appcard-x></div></div>
<div id="c" class="variant"><div class="screen"><aside class="nav"><b>Y</b></aside><clientlist-x></clientlist-x><appcard-x mode="wizard"></appcard-x></div></div>
<div class="drawer" id="drawer"><div class="drawer-head"><div><small class="muted">КЛИЕНТ: АННА КОВАЛЕНКО</small><h2>Новые замеры</h2></div><button class="close" onclick="closeAll()">×</button></div><div class="notice">Спортсмен автоматически: <b>Анна Коваленко</b><br><small>Измените только если изделие для другого человека.</small></div><label class="field">Для кого<select><option>Анна Коваленко — клиент</option><option>+ Другой спортсмен</option></select></label><formfields-x></formfields-x><div class="actions"><button class="secondary" onclick="closeAll()">Отмена</button><button class="primary" onclick="save()">Сохранить замеры</button></div></div>
<div class="modal-wrap" id="wizard"><div class="modal"><div class="drawer-head"><h2 id="wizard-title">Для кого изделие?</h2><button class="close" onclick="closeAll()">×</button></div><div class="steps"><i class="step on"></i><i class="step" id="step2"></i></div><div id="wizard1"><div class="athlete"><div><b>Анна Коваленко</b><div class="muted">Клиент · выбрать автоматически</div></div><input type="radio" checked></div><button class="link" onclick="toast('Добавление второго спортсмена доступно')">+ Другой спортсмен</button><div class="actions"><button class="primary" onclick="nextStep()">Далее: замеры</button></div></div><div class="wizard-2" id="wizard2"><formfields-x></formfields-x><div class="actions"><button class="secondary" onclick="prevStep()">Назад</button><button class="primary" onclick="save()">Сохранить</button></div></div></div></div>
<div class="toast" id="toast"></div><div class="tools"><button onclick="document.body.style.maxWidth=document.body.style.maxWidth?'':'760px'">↔ Размер</button></div>
<template id="clients"><aside class="clients"><input class="search" placeholder="Поиск клиентов…"><div class="person active"><i class="avatar">АК</i><span><b>Анна Коваленко</b><small>Украина</small></span></div><div class="person"><i class="avatar">МС</i><span><b>Мария Соколова</b><small>Instagram</small></span></div></aside></template>
<template id="fields"><div class="measure-hint"><b>Базовые измерения отмечены *</b><span>Все значения указываются в сантиметрах</span></div><div class="grid measurements-grid">
<label class="field required"><span><b>1.</b> Обхват груди (под мышками) *</span><input name="m1" type="number" min="1" step="0.1" required placeholder="см"></label>
<label class="field required"><span><b>2.</b> Обхват талии (по резинке) *</span><input name="m2" type="number" min="1" step="0.1" required placeholder="см"></label>
<label class="field required"><span><b>3.</b> Обхват бёдер *</span><input name="m3" type="number" min="1" step="0.1" required placeholder="см"></label>
<label class="field"><span><b>4.</b> От талии до основания шеи спереди</span><input name="m4" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>5.</b> Длина плеча</span><input name="m5" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>6.</b> Длина рукава (+2 см)</span><input name="m6" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>7.</b> Обхват запястья</span><input name="m7" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>8.</b> Обхват бицепса</span><input name="m8" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>9.</b> Высота стойки воротника</span><input name="m9" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>10.</b> Обхват шеи у основания</span><input name="m10" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>11.</b> Ширина плеч</span><input name="m11" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>12.</b> От подмышки до резинки на талии</span><input name="m12" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>13.</b> Длина юбки сзади</span><input name="m13" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>14.</b> Длина юбки сбоку</span><input name="m14" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field required"><span><b>15.</b> Обхват через пах и плечо *</span><input name="m15" type="number" min="1" step="0.1" required placeholder="см"></label>
<label class="field"><span><b>16.</b> Длина юбки спереди</span><input name="m16" type="number" min="1" step="0.1" placeholder="см"></label>
<label class="field"><span><b>17.</b> От талии до верхней линии плавок</span><input name="m17" type="number" min="1" step="0.1" placeholder="см"></label>
</div></template>

<template id="card"><section class="main"><article class="card"><header class="head"><div><small class="muted">КАРТОЧКА КЛИЕНТА</small><h1>Анна Коваленко</h1></div><button class="primary add">+ Добавить замеры</button></header><div class="content"><div class="facts"><div class="fact"><small>Канал</small><b>Instagram</b></div><div class="fact"><small>Телефон</small><b>+380 67 123 45 67</b></div><div class="fact"><small>Страна</small><b>Украина</b></div></div><div class="section-title"><h2>Для кого шьём</h2><button class="link" onclick="toast('Открыта форма второго спортсмена')">+ Другой спортсмен</button></div><div class="athlete"><div><b>Анна Коваленко</b><div class="muted">Совпадает с клиентом · художественная гимнастика</div></div><span class="tag">Замеры актуальны</span></div><div class="inline-form"><b>Новые замеры · Анна Коваленко</b><formfields-x></formfields-x><div class="actions"><button class="secondary" onclick="closeAll()">Отмена</button><button class="primary" onclick="save()">Сохранить</button></div></div><div class="section-title"><h2>Последние замеры</h2><span class="muted">12 июня 2026</span></div><div class="athlete"><span>Рост <b>154</b></span><span>Грудь <b>74</b></span><span>Талия <b>61</b></span><span>Бёдра <b>78</b></span><span>Торс <b>132</b></span></div></div></article></section></template>
<script>
class ClientList extends HTMLElement{connectedCallback(){this.replaceWith(document.getElementById('clients').content.cloneNode(true))}}class FormFields extends HTMLElement{connectedCallback(){this.replaceWith(document.getElementById('fields').content.cloneNode(true))}}class AppCard extends HTMLElement{connectedCallback(){const n=document.getElementById('card').content.cloneNode(true),mode=this.getAttribute('mode');n.querySelector('.add').onclick=()=>openMode(mode);this.replaceWith(n)}}customElements.define('clientlist-x',ClientList);customElements.define('formfields-x',FormFields);customElements.define('appcard-x',AppCard);document.querySelectorAll('ClientList').forEach(x=>{const n=document.createElement('clientlist-x');x.replaceWith(n)});document.querySelectorAll('FormFields').forEach(x=>{const n=document.createElement('formfields-x');x.replaceWith(n)});document.querySelectorAll('AppCard').forEach(x=>{const n=document.createElement('appcard-x');n.setAttribute('mode',x.getAttribute('mode'));x.replaceWith(n)});
function show(id,b){document.querySelectorAll('.variant').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.variants button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function openMode(m){if(m==='drawer')document.getElementById('drawer').classList.add('open');if(m==='inline')document.querySelector('#b .inline-form').classList.add('open');if(m==='wizard')document.getElementById('wizard').classList.add('open')}function closeAll(){document.getElementById('drawer').classList.remove('open');document.getElementById('wizard').classList.remove('open');document.querySelectorAll('.inline-form').forEach(x=>x.classList.remove('open'))}function nextStep(){wizard1.style.display='none';wizard2.style.display='block';step2.classList.add('on');document.getElementById('wizard-title').textContent='Введите замеры'}function prevStep(){wizard1.style.display='block';wizard2.style.display='none';step2.classList.remove('on');document.getElementById('wizard-title').textContent='Для кого изделие?'}function save(){const box=document.getElementById('drawer').classList.contains('open')?document.getElementById('drawer'):document.getElementById('wizard').classList.contains('open')?document.getElementById('wizard'):document.querySelector('.variant.active .inline-form');const missing=[...box.querySelectorAll('input[required]')].filter(x=>!x.value);if(missing.length){missing[0].focus();missing.forEach(x=>x.style.borderColor='var(--color-danger)');toast('Заполните обязательные измерения №1, №2, №3 и №15');return}closeAll();toast('Все 17 измерений сохранены в карточке клиента')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
</script></body></html>

<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Варианты панели чата — Yoleotard CRM</title><link rel="stylesheet" href="../themes/default.css">
<style>
*{box-sizing:border-box}body{margin:0;padding-top:54px;background:var(--color-bg);color:var(--color-text);font:14px var(--font-sans)}button,input,textarea{font:inherit}.variant-nav{position:fixed;z-index:20;inset:0 0 auto;display:flex;justify-content:center;gap:8px;padding:8px;background:#fff;border-bottom:1px solid var(--color-border)}.variant-nav button{padding:8px 13px;border:1px solid var(--color-border);border-radius:9px;background:#fff;cursor:pointer;transition:.15s}.variant-nav button:hover,.variant-nav button.active{border-color:var(--color-primary);background:var(--color-primary);color:#fff}.app{display:grid;grid-template-columns:58px 300px minmax(420px,1fr) 390px;height:calc(100vh - 54px);max-width:1900px;margin:auto;background:#fff;border-inline:1px solid var(--color-border)}.rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 8px;background:#fff;border-right:1px solid var(--color-border)}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--color-primary);color:#fff;font-weight:800}.rail button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:#625a6e;cursor:pointer}.rail button.on{background:var(--color-accent);color:var(--color-primary)}.inbox{min-width:0;background:#fff;border-right:1px solid var(--color-border)}.inbox-head{padding:15px}.inbox-head h2{margin:0 0 12px}.search{width:100%;height:38px;padding:0 10px;border:1px solid var(--color-border);border-radius:9px}.filters{display:flex;gap:6px;margin-top:9px}.filter{width:31px;height:31px;border:1px solid var(--color-border);border-radius:8px;background:#fff;font-weight:800}.filter.on{outline:2px solid #d8ccfa;outline-offset:1px}.fb{background:#1877f2;color:#fff}.ig{background:linear-gradient(135deg,#833ab4,#e1306c,#f77737);color:#fff}.wa{background:#25d366;color:#fff}.cw{background:#1f93ff;color:#fff}.gm{background:#ea4335;color:#fff}.person{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:9px;width:100%;padding:12px;border:0;border-top:1px solid #f0ecf2;background:#fff;text-align:left;cursor:pointer}.person.active{background:#f1ebff}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e8deff;color:var(--color-primary);font-weight:800}.person b,.person small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person small{margin-top:4px;color:var(--color-text-muted)}.person time{font-size:11px;color:var(--color-text-muted)}.chat{display:grid;grid-template-rows:58px minmax(0,1fr) auto;min-width:0;background:#fcfbfd}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--color-border);background:#fff}.identity{display:flex;align-items:center;gap:9px}.identity small{display:block;color:var(--color-text-muted)}.channel{padding:5px 9px;border-radius:20px;background:#f1ebff;color:var(--color-primary)}.messages{overflow:auto;padding:18px}.day{text-align:center;color:#948b9b;font-size:11px}.message{width:max-content;max-width:76%;margin:10px 0;padding:10px 12px;border:1px solid var(--color-border);border-radius:13px;background:#fff;line-height:1.42}.message.out{margin-left:auto;border-color:var(--color-primary);background:var(--color-primary);color:#fff}.message time{display:block;margin-top:5px;text-align:right;font-size:10px;opacity:.65}.composer{padding:10px;background:#fff;border-top:1px solid var(--color-border)}.compose{display:grid;grid-template-columns:auto 1fr auto;gap:8px}.compose textarea{min-height:48px;padding:9px;border:1px solid var(--color-border);border-radius:9px;resize:none}.compose button{border:0;border-radius:9px;padding:10px;background:var(--color-primary);color:#fff}.context{min-width:0;overflow:auto;padding:12px;background:#f7f8fb;border-left:1px solid var(--color-border)}.profile{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--color-border);border-radius:13px;background:#fff}.profile .avatar{width:44px;height:44px}.profile b,.profile small{display:block}.profile small{color:var(--color-text-muted)}.kebab{border:0;background:none;font-size:20px;cursor:pointer}.summary{display:flex;gap:6px;margin:10px 0}.chip{padding:5px 8px;border-radius:8px;background:#fff;border:1px solid var(--color-border);font-size:11px}.section{margin-top:12px;padding:12px;border:1px solid var(--color-border);border-radius:12px;background:#fff}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section h3{margin:0;font-size:14px}.link,.plus{border:0;background:none;color:var(--color-primary);cursor:pointer}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quick-grid button,.wide-action{min-height:38px;padding:8px;border:1px solid #dcd4e6;border-radius:9px;background:#fff;text-align:left;cursor:pointer;transition:.15s}.quick-grid button:hover,.wide-action:hover{border-color:var(--color-primary);background:var(--color-accent)}.note{padding:9px;border-left:3px solid var(--color-primary);border-radius:0 8px 8px 0;background:#f7f3ff;color:#5f5666}.order{padding:10px;border:1px solid var(--color-border);border-radius:10px;background:#fff}.order-top{display:flex;justify-content:space-between;align-items:center}.status{padding:4px 7px;border-radius:8px;background:#dff6ef;color:#217360;font-size:10px;font-weight:700}.order p{margin:7px 0;color:var(--color-text-muted)}.order-data{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:8px;border-top:1px dashed var(--color-border)}.order-data small,.order-data b{display:block}.order-data small{color:var(--color-text-muted)}.task{display:flex;gap:8px;align-items:flex-start}.task input{accent-color:var(--color-primary)}.tabs{display:flex;gap:5px;margin:12px 0}.tabs button{flex:1;padding:8px 5px;border:1px solid var(--color-border);border-radius:8px;background:#fff;cursor:pointer}.tabs button.active{border-color:var(--color-primary);background:var(--color-accent);color:var(--color-primary);font-weight:700}.tab-panel{display:none}.tab-panel.active{display:block}.field{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eeeaf1}.field span{color:var(--color-text-muted)}.action-stack{display:grid;gap:8px}.action-stack button{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:10px 12px;border:1px solid var(--color-border);border-radius:10px;background:#fff;text-align:left;cursor:pointer}.action-stack button strong{display:block}.action-stack button small{color:var(--color-text-muted)}.action-stack i{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--color-accent);color:var(--color-primary);font-style:normal}.activity{position:relative;margin-left:8px;padding:0 0 15px 18px;border-left:2px solid #e5dff0}.activity::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--color-primary)}.activity small{color:var(--color-text-muted)}.modal{position:fixed;z-index:50;inset:0;display:none;place-items:center;background:#211a2d66}.modal.open{display:grid}.modal-card{width:min(420px,calc(100vw - 30px));padding:18px;border-radius:15px;background:#fff;box-shadow:var(--shadow-lg)}.modal-card header{display:flex;justify-content:space-between}.modal-card h2{margin:0}.modal-card label{display:grid;gap:5px;margin-top:12px}.modal-card input,.modal-card textarea{padding:9px;border:1px solid var(--color-border);border-radius:8px}.modal-card footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.modal-card button{padding:8px 12px;border:1px solid var(--color-border);border-radius:8px;background:#fff}.modal-card .primary{border-color:var(--color-primary);background:var(--color-primary);color:#fff}.toast{position:fixed;z-index:60;left:50%;bottom:18px;transform:translate(-50%,80px);padding:10px 15px;border-radius:9px;background:#211a2d;color:#fff;transition:.2s}.toast.show{transform:translate(-50%,0)}.tools{position:fixed;z-index:40;right:10px;bottom:10px;padding:6px;border-radius:8px;background:#211a2dcc;opacity:.45}.tools:hover{opacity:1}.tools button{padding:5px;border:0;background:none;color:#fff}.variant-title{margin:2px 0 10px;color:var(--color-primary);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:1100px){.app{grid-template-columns:58px 230px minmax(380px,1fr) 330px}.context{padding:9px}.quick-grid{grid-template-columns:1fr}}@media(max-width:850px){.app{grid-template-columns:58px 190px 1fr}.context{position:fixed;z-index:15;inset:54px 0 0 auto;width:min(390px,90vw);box-shadow:-10px 0 30px #211a2d22}.chat-head::after{content:"Карточка";padding:6px;border-radius:7px;background:var(--color-accent);color:var(--color-primary)}}
</style></head><body>
<nav class="variant-nav"><button class="active" data-variant="a">A: Обзор</button><button data-variant="b">B: Вкладки</button><button data-variant="c">C: Центр действий</button></nav>
<main class="app" id="preview"><aside class="rail"><span class="logo">Y</span><button>⌂</button><button class="on">✉</button><button>●</button><button>▣</button><button>⚙</button><button>✓</button></aside>
<aside class="inbox"><div class="inbox-head"><h2>Входящие</h2><input class="search" placeholder="Имя, телефон, Instagram…"><div class="filters"><button class="filter fb on">f</button><button class="filter ig">◎</button><button class="filter wa">◉</button><button class="filter cw">C</button><button class="filter gm">M</button></div></div>
<button class="person active"><span class="avatar">PC</span><span><b>Piigeroa Claire</b><small>how i can pay and do you ship…</small></span><time>09:15</time></button><button class="person"><span class="avatar">CL</span><span><b>Christabel Lim Meiling</b><small>image.jpg</small></span><time>11:40</time></button><button class="person"><span class="avatar">GV</span><span><b>Glaucia Vasconcelos</b><small>Hi, Glaucia! — yes, we ship…</small></span><time>14:46</time></button></aside>
<section class="chat"><header class="chat-head"><div class="identity"><span class="avatar">PC</span><span><b>Piigeroa Claire</b><small>Facebook · Yoleotard_fb</small></span></div><span class="channel">f Facebook</span></header><div class="messages"><div class="day">30 августа 2026</div><div class="message in">how i can pay<br>and do you ship in philippines<time>09:12</time></div><div class="message out">Мы подготовим инвойс на согласованную сумму. После оплаты пришлите имя получателя и полный адрес доставки.<time>09:13 ✓✓</time></div><div class="message in">okey<time>09:14</time></div></div><footer class="composer"><div class="compose"><button>＋</button><textarea placeholder="Введите сообщение клиенту…"></textarea><button>Отправить</button></div></footer></section>
<aside class="context" id="context"></aside></main>
<div class="modal" id="modal"><form class="modal-card" onsubmit="saveAction(event)"><header><h2 id="modalTitle">Новое действие</h2><button type="button" onclick="closeModal()">×</button></header><label>Название<input id="actionName" required value="Связаться с клиентом"></label><label>Комментарий<textarea rows="3" placeholder="Детали для менеджера"></textarea></label><footer><button type="button" onclick="closeModal()">Отмена</button><button class="primary">Сохранить</button></footer></form></div><div class="toast" id="toast">Сохранено</div>
<div class="tools"><button onclick="setWidth(390)">Телефон</button><button onclick="setWidth(900)">Планшет</button><button onclick="setWidth('')">Экран</button></div>
<script>
const variants={
a:`<div class="variant-title">A · Постоянный обзор</div><div class="profile"><span class="avatar">PC</span><span><b>Piigeroa Claire</b><small>37950105607969853</small></span><button class="kebab" onclick="toastMsg('Меню клиента открыто')">⋮</button></div><div class="summary"><span class="chip">Филиппины</span><span class="chip">2 покупки</span><span class="chip">310 €</span></div><section class="section"><div class="section-head"><h3>Быстрые действия</h3></div><div class="quick-grid"><button onclick="openAction('Новая задача')">✓ Создать задачу</button><button onclick="openAction('Новый заказ')">▣ Создать заказ</button><button onclick="openAction('Новый инвойс')">₴ Создать инвойс</button><button onclick="openAction('Новая заметка')">✎ Добавить заметку</button></div></section><section class="section"><div class="section-head"><h3>Заметка чата</h3><button class="plus" onclick="openAction('Новая заметка')">+ Добавить</button></div><div class="note">Клиент ждёт расчёт доставки на Филиппины.</div></section><section class="section"><div class="section-head"><h3>Активный заказ <span class="chip">1</span></h3><button class="plus" onclick="openAction('Новый заказ')">＋</button></div>${orderCard()}</section><section class="section"><div class="section-head"><h3>Следующее действие</h3></div><label class="task"><input type="checkbox" onchange="toastMsg(this.checked?'Задача завершена':'Задача возвращена')"><span><b>Отправить инвойс</b><small>Сегодня, ответственный: Олег</small></span></label></section>`,
b:`<div class="variant-title">B · Данные по вкладкам</div><div class="profile"><span class="avatar">PC</span><span><b>Piigeroa Claire</b><small>Facebook · активный лид</small></span><button class="kebab">⋮</button></div><div class="tabs"><button class="active" data-tab="client">Клиент</button><button data-tab="orders">Заказы</button><button data-tab="actions">Действия</button></div><div class="tab-panel active" data-panel="client"><section class="section"><div class="field"><span>Телефон</span><button class="link" onclick="openAction('Добавить телефон')">+ Добавить</button></div><div class="field"><span>E-mail</span><button class="link" onclick="openAction('Добавить e-mail')">+ Добавить</button></div><div class="field"><span>Страна</span><b>Philippines</b></div><div class="field"><span>Клиент с</span><b>30.08.2026</b></div></section><section class="section"><div class="section-head"><h3>Заметка</h3><button class="plus" onclick="openAction('Новая заметка')">+ Добавить</button></div><div class="note">Нужен расчёт доставки и инвойс.</div></section></div><div class="tab-panel" data-panel="orders"><section class="section">${orderCard()}</section><button class="wide-action" onclick="openAction('Новый заказ')">＋ Создать новый заказ</button></div><div class="tab-panel" data-panel="actions"><div class="action-stack">${actionButtons()}</div></div>`,
c:`<div class="variant-title">C · Контекстный центр действий</div><div class="profile"><span class="avatar">PC</span><span><b>Piigeroa Claire</b><small>Новый покупатель · Facebook</small></span><button class="kebab">⋮</button></div><section class="section"><div class="section-head"><h3>Создать из переписки</h3></div><div class="action-stack">${actionButtons()}</div></section><section class="section"><div class="section-head"><h3>Контекст</h3><button class="link" onclick="toastMsg('Контекст обновлён')">Обновить</button></div><div class="activity"><b>Входящее сообщение</b><small>Клиент спрашивает об оплате и доставке</small></div><div class="activity"><b>Рекомендация CRM</b><small>Создать инвойс и запросить адрес</small></div><div class="activity"><b>Последний заказ</b><small>№661 · не оплачен · 310 €</small></div></section><section class="section"><div class="section-head"><h3>Закреплённое</h3><button class="plus" onclick="openAction('Закрепить заметку')">＋</button></div><div class="note">После оплаты запросить телефон и полный адрес.</div></section>`};
function orderCard(){return `<article class="order"><div class="order-top"><span class="status">НОВЫЙ</span><b>№661</b><button class="kebab">⋮</button></div><p>Facebook · noname, Philippines</p><div class="order-data"><span><small>Оплата</small><b>Не оплачен</b></span><span><small>Сумма</small><b>310,00 €</b></span></div></article>`}function actionButtons(){return `<button onclick="openAction('Новая задача')"><span><strong>✓ Задача</strong><small>Поставить напоминание менеджеру</small></span><i>＋</i></button><button onclick="openAction('Новый заказ')"><span><strong>▣ Заказ</strong><small>Создать заказ для этого клиента</small></span><i>＋</i></button><button onclick="openAction('Новый инвойс')"><span><strong>₴ Инвойс</strong><small>Подготовить документ на оплату</small></span><i>＋</i></button><button onclick="openAction('Новая заметка')"><span><strong>✎ Заметка</strong><small>Сохранить контекст разговора</small></span><i>＋</i></button>`}
let current='a';function render(){context.innerHTML=variants[current];document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===button.dataset.tab))})}document.querySelectorAll('[data-variant]').forEach(button=>button.onclick=()=>{current=button.dataset.variant;document.querySelectorAll('[data-variant]').forEach(x=>x.classList.toggle('active',x===button));render()});document.querySelectorAll('.filter').forEach(button=>button.onclick=()=>button.classList.toggle('on'));function openAction(title){modalTitle.textContent=title;actionName.value=title;modal.classList.add('open');actionName.focus()}function closeModal(){modal.classList.remove('open')}function saveAction(event){event.preventDefault();closeModal();toastMsg('Сохранено: '+actionName.value)}function toastMsg(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}function setWidth(width){preview.style.maxWidth=width?width+'px':'';preview.style.margin=width?'auto':''}render();
</script></body></html>

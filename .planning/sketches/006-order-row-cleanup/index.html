tton{border:1px solid var(--color-border);background:#fff;border-radius:8px;padding:7px 10px}.actions .pay{background:var(--color-primary);border-color:var(--color-primary);color:#fff}.notice{margin-right:auto;display:flex;gap:8px;align-items:center;color:#9b5900}.notice b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff1d6}.detail-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0}.card{padding:16px 18px;min-height:174px;border-right:1px solid var(--color-border)}.card:last-child{border:0}.card h3{font-size:11px;color:#7e7487;letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px}.product-detail{display:grid;grid-template-columns:78px 1fr;gap:13px}.large-photo{width:78px;height:108px;object-fit:cover;border-radius:9px;background:linear-gradient(145deg,#ff3d92,#5434dc)}.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed #eee9f1}.line:last-child{border:0}.line span{color:#7f7588}.history{display:grid;gap:7px}.payment{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:8px;background:#faf8fb}.ok{color:#27834e}.drawer-overlay{position:relative;min-height:430px}.dim{position:absolute;inset:0;background:#2a20343b}.drawer{position:absolute;right:0;top:0;width:430px;height:100%;background:#fff;box-shadow:-16px 0 40px #24152b24;padding:18px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:3px 0}.summary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.summary-strip div{padding:10px;background:#f8f5fa;border-radius:9px}.summary-strip span{display:block;color:#867b8f;font-size:11px}.drawer section{margin:16px 0;padding-top:14px;border-top:1px solid var(--color-border)}.drawer section h3{margin:0 0 10px}.drawer-actions{position:sticky;bottom:-18px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;padding:12px 0}.tabs{disp </style></head><body>

<script>
const photo='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#ff3e92"/><stop offset="1" stop-color="#4231c5"/></linearGradient></defs><rect width="100" height="140" rx="10" fill="url(#g)"/><circle cx="50" cy="25" r="12" fill="#ffd8c7"/><path d="M30 40 Q50 28 70 40 L79 100 Q50 123 21 100Z" fill="#171028"/><path d="M31 43 L50 75 69 43M27 62 L73 62" stroke="#ffda3a" stroke-width="5" fill="none"/></svg>`);
function shell(body){return `<div class="shell"><aside><div class="brand"><div class="logo">Y</div><div>Yoleotard<small>CRM</small></div></div><div class="menu"><span>⌂ Обзор</span><span>✉ Входящие</span><span>👤 Клиенты</span><span class="on">▣ Заказы</span><span>⚙ Производство</span><span>₴ Финансы</span><span>➜ Доставка</span></div></aside><div class="content"><header class="page-head"><div><div class="eyebrow">РАБОТА С ЗАКАЗАМИ</div><h1>Заказы</h1><span class="muted">Модели, размеры, сроки, оплата и доставка</span></div><button class="primary" onclick="toast('Открыта форма нового заказа')">+ Новый заказ</button></header><div class="stats"><div class="stat">Активные <b>1</b></div><div class="stat">Нужна предоплата <b>0</b></div><div class="stat">Срок ≤ 7 дней <b>0</b></div><div class="stat">Просрочены <b>0</b></div></div><div class="filters"><input class="search" placeholder="Номер, клиент, спортсмен…"><button class="chip on">Все 1</button><button class="chip">Срочные 0</button><button class="chip">Без предоплаты 0</button><button class="chip">Готовые</button></div>${body}</div></div>`}
function head(){return `<div class="thead"><div></div><div>№ заказа</div><div>Тип / модель</div><div>Клиент / состав</div><div>Источник</div><div>Базовые размеры</div><div>Срок</div><div>Оплата</div><div>Доставка</div><div>Продажа</div><div>Производство</div></div>`}
function row(open){return `<div class="row"><div class="control"><button class="toggle" onclick="toggleCurrent()">${open?'⌄':'›'}</button>□</div><div class="cell"><strong>1</strong></div><div class="cell model"><img class="thumb previewable" src="${photo}" onmouseenter="showImagePreview(event,this)" onmousemove="moveImagePreview(event)" onmouseleave="hideImagePreview()"><div><strong>Индивидуальный</strong><small>custom leotard hand made</small></div></div><div class="cell"><strong>Oleh Ohilko / ru <span title="Ukraine" aria-label="Ukraine">🇺🇦</span></strong><small>Oleh Ohilko</small></div><div class="cell"><span class="source-icon" title="Источник: вручную" aria-label="Источник: вручную">✎</span></div><div class="cell"><strong>Рост 120 · 62 / 53 / 65 / 113 см</strong><small>№1 / №2 / №3 / №15</small></div><div class="cell"><strong>26 сент. 2026 г.</strong><small>Через 48 дн.</small></div><div class="cell"><strong>400,00 €</strong><small class="paid-money">Оплачено 200,00 €</small><small class="money">Остаток 200,00 €</small></div><div class="cell"><strong>Ukraine</strong><small>Не готов к отправке</small></div><div class="cell"><span class="badge">Новый заказ</span></div><div class="cell"><span class="badge violet">Не запланирован</span></div></div>`}
function actions(){return `<div class="actions"><span class="notice"><b>!</b> Требуется уточнить способ доставки</span><button onclick="toast('Открыта полная карточка')">Открыть карточку</button><button onclick="toast('Открыт выбор статуса')">Изменить статус</button><button class="pay" onclick="toast('Открыта форма оплаты')">+ Добавить оплату</button></div>`}
const product=`<div class="card"><h3>Изделие и примечания</h3><div class="product-detail"><img class="large-photo previewable" src="${photo}" onmouseenter="showImagePreview(event,this)" onmousemove="moveImagePreview(event)" onmouseleave="hideImagePreview()"><div><strong>custom leotard hand made</strong><p class="muted">Акробатика, подкладка, стразы не более 10 мм. Модель согласована.</p><div class="line"><span>Файлы</span><b>2 изображения</b></div><div class="line"><span>Ответственный</span><b>Не назначен</b></div></div></div></div>`;
const payments=`<div class="card"><h3>История оплат</h3><div class="history"><div class="payment"><span>07 авг.</span><b>200,00 €</b><em class="ok">✓ Получено</em></div><div class="line"><span>Способ</span><b>Банковский перевод</b></div><div class="line"><span>Следующий платёж</span><b>До отправки · 200,00 €</b></div></div></div>`;
const delivery=`<div class="card"><h3>Детали доставки</h3><div class="line"><span>Получатель</span><b>Oleh Ohilko</b></div><div class="line"><span>Город / отделение</span><b class="money">Не заполнено</b></div><div class="line"><span>Служба доставки</span><b class="money">Не выбрана</b></div><div class="line"><span>Трекинг</span><b>—</b></div></div>`;
function table(detail=''){return `<div class="table"><div class="scroll">${head()}${row(Boolean(detail))}${detail}</div></div>`}
const removed=`<div class="removed"><b>Убраны повторы:</b> номер, клиент, источник, страну и язык, дату создания, общий срок, стоимость, оплаченная сумма и статусы уже видны в строке.</div>`;
document.getElementById('variant-a').innerHTML=shell(table(`<div class="detail">${actions()}<div class="detail-grid">${product}${payments}${delivery}</div></div>`)+removed);
const drawer=`<div class="drawer-overlay"><div class="dim"></div><div class="drawer"><div class="drawer-head"><div><span class="muted">Заказ №1</span><h2>Детали заказа</h2></div><button onclick="toast('Карточка закрыта')">×</button></div><div class="summary-strip"><div><span>Остаток</span><b>200,00 €</b></div><div><span>Срок</span><b>48 дней</b></div><div><span>Замеры</span><b class="ok">Готовы</b></div></div>${product.replace('class="card"','')}${delivery.replace('class="card"','')}<section><h3>Последняя оплата</h3><div class="payment"><span>07 авг.</span><b>200,00 €</b><em class="ok">✓ Получено</em></div></section><div class="drawer-actions"><button onclick="toast('Открыт статус')">Изменить статус</button><button class="primary" onclick="toast('Открыта оплата')">+ Оплата</button></div></div></div>`;
document.getElementById('variant-b').innerHTML=shell(table('')+drawer+removed);
const tabs=`<div class="detail">${actions()}<div class="tabs"><button class="active" onclick="tab(this,'product')">Изделие</button><button onclick="tab(this,'payments')">Оплата</button><button onclick="tab(this,'delivery')">Доставка</button></div><div class="tab-panel"><div id="product" class="active">${product}<div class="card"><h3>Что требует внимания</h3><div class="line"><span>Ответственный</span><b>Не назначен</b></div><div class="line"><span>Производство</span><b>Не запланировано</b></div></div></div><div id="payments">${payments}<div class="card"><h3>План оплаты</h3><div class="line"><span>Предоплата</span><b class="ok">Внесена</b></div><div class="line"><span>Остаток</span><b>200,00 €</b></div></div></div><div id="delivery">${delivery}<div class="card"><h3>Контроль</h3><div class="line"><span>Адрес подтверждён</span><b class="money">Нет</b></div><div class="line"><span>Готовность</span><b>После производства</b></div></div></div></div></div>`;
document.getElementById('variant-c').innerHTML=shell(table(tabs)+removed);
function showVariant(id,btn){document.querySelectorAll('.variant').forEach(x=>x.classList.remove('active'));document.getElementById('variant-'+id).classList.add('active');document.querySelectorAll('.variants button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function tab(btn,id){btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');btn.closest('.detail').querySelectorAll('.tab-panel>div').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function toggleCurrent(){toast('В реальном интерфейсе строка свернётся или раскроется')}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
function viewport(w){const p=document.getElementById('preview');p.style.maxWidth=w;p.style.margin='0 auto'}
</script><style>.settings-backdrop{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:flex-end;padding:108px 24px;background:#281b3538}.settings-backdrop.open{display:flex}.settings-panel{width:390px;max-height:calc(100vh - 132px);overflow:auto;background:#fff;border:1px solid var(--color-border);border-radius:14px;box-shadow:0 18px 55px #25152e2b;padding:18px}.settings-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.settings-head h2{margin:0 0 4px;font-size:20px}.settings-head button{border:0;background:transparent;font-size:22px}.locked-note{margin:13px 0;padding:10px 12px;background:#f7f4fa;border-radius:9px;color:#716778}.column-list{display:grid;gap:7px}.column-setting{display:grid;grid-template-columns:24px 1fr 32px 32px;align-items:center;gap:5px;padding:9px;border:1px solid var(--color-border);border-radius:9px;background:#fff}.drag{color:#9b90a4;font-size:18px;cursor:grab}.column-setting label{display:flex;align-items:center;gap:8px;font-weight:650}.column-setting button{height:29px;border:1px solid var(--color-border);border-radius:7px;background:#faf8fb}.settings-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.settings-actions button{border:1px solid var(--color-border);border-radius:8px;background:#fff;padding:9px 12px}.settings-actions .primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}.country-cell{white-space:nowrap}.source-value{display:flex;align-items:center;gap:7px;white-space:nowrap}.preview-size-setting{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:12px;margin:0 0 13px;padding:11px 12px;border:1px solid var(--color-border);border-radius:9px}.preview-size-setting label{font-weight:700}.preview-size-setting small{display:block;margin-top:3px;color:#83798d;font-weight:400}.preview-size-setting input{width:100%;padding:8px;border:1px solid var(--color-border);border-radius:7px}</style>
<div id="column-settings" class="settings-backdrop" onclick="if(event.target===this)closeColumnSettings()"><div class="settings-panel"><div class="settings-head"><div><h2>Поля таблицы</h2><span class="muted">Перетаскивайте поля или используйте стрелки.</span></div><button onclick="closeColumnSettings()">×</button></div><div class="locked-note"><b>Всегда в начале:</b> только управление раскрытием и выбором строки. Все информационные колонки можно перемещать.</div><div class="preview-size-setting"><label for="preview-width">Ширина предпросмотра<small>Высота рассчитывается пропорционально</small></label><input id="preview-width" type="number" min="200" max="1200" step="50" value="600" oninput="setPreviewWidth(this.value)"></div><div id="column-list" class="column-list"></div><div class="settings-actions"><button onclick="resetColumns()">Сбросить</button><button class="primary" onclick="closeColumnSettings()">Готово</button></div></div></div>
<script>
const defs={number:['№ заказа',62,()=>`<div class="cell"><strong>1</strong></div>`],model:['Тип / модель',180,()=>`<div class="cell model"><img class="thumb previewable" src="${photo}" onmouseenter="showImagePreview(event,this)" onmousemove="moveImagePreview(event)" onmouseleave="hideImagePreview()"><div><strong>Индивидуальный</strong><small>custom leotard hand made</small></div></div>`],client:['Клиент / состав',165,()=>`<div class="cell"><strong>Oleh Ohilko</strong><small>Спортсмен: Oleh Ohilko</small></div>`],country:['Страна / язык',110,()=>`<div class="cell country-cell"><strong>🇺🇦 Украина</strong><small>ru</small></div>`],source:['Источник',105,()=>`<div class="cell source-value"><span class="source-icon" title="Источник: вручную">✎</span><strong>Вручную</strong></div>`],sizes:['Базовые размеры',180,()=>`<div class="cell"><strong>Рост 120 · 62 / 53 / 65 / 113 см</strong><small>№1 / №2 / №3 / №15</small></div>`],deadline:['Срок',135,()=>`<div class="cell"><strong>26 сент. 2026 г.</strong><small>Через 48 дн.</small></div>`],payment:['Оплата',185,()=>`<div class="cell"><strong>400,00 €</strong><small class="paid-money">Оплачено 200,00 €</small><small class="money">Остаток 200,00 €</small></div>`],delivery:['Доставка',130,()=>`<div class="cell"><strong>Украина</strong><small>Не готов к отправке</small></div>`],sales:['Продажа',110,()=>`<div class="cell"><span class="badge">Новый заказ</span></div>`],production:['Производство',130,()=>`<div class="cell"><span class="badge violet">Не запланирован</span></div>`]};
const defaults=Object.keys(defs);let saved=null;try{saved=JSON.parse(localStorage.getItem('yo-order-columns-v2')||'null')}catch(e){}let colOrder=saved?.order?.filter(x=>defs[x])||[...defaults];defaults.forEach(x=>{if(!colOrder.includes(x))colOrder.push(x)});let hidden=new Set(saved?.hidden||[]),dragged=null;
const active=()=>colOrder.filter(x=>!hidden.has(x)),grid=()=>['50px',...active().map(x=>'minmax('+defs[x][1]+'px,'+defs[x][1]+'fr)')].join(' '),minw=()=>50+active().reduce((n,x)=>n+defs[x][1],0),save=()=>localStorage.setItem('yo-order-columns-v2',JSON.stringify({order:colOrder,hidden:[...hidden]}));
const oldShell=shell;shell=body=>oldShell(body).replace('<button class="chip">Готовые</button>','<button class="chip">Готовые</button><button class="chip" onclick="openColumnSettings()">⚙ Столбцы</button>');
head=()=>`<div class="thead" style="grid-template-columns:${grid()};min-width:${minw()}px"><div></div>${active().map(x=>`<div>${defs[x][0]}</div>`).join('')}</div>`;
row=open=>`<div class="row" style="grid-template-columns:${grid()};min-width:${minw()}px"><div class="control"><button class="toggle" onclick="toggleCurrent()">${open?'⌄':'›'}</button>□</div>${active().map(x=>defs[x][2]()).join('')}</div>`;
function rerender(){['a','b','c'].forEach(v=>{const root=document.getElementById('variant-'+v),filter=root.querySelector('.filters');if(!filter.querySelector('[onclick="openColumnSettings()"]'))filter.insertAdjacentHTML('beforeend','<button class="chip" onclick="openColumnSettings()">⚙ Столбцы</button>');const scroll=root.querySelector('.table .scroll'),detail=scroll.querySelector('.detail');scroll.innerHTML=head()+row(Boolean(detail))+(detail?detail.outerHTML:'')})}
function openColumnSettings(){renderSettings();document.getElementById('column-settings').classList.add('open')}function closeColumnSettings(){document.getElementById('column-settings').classList.remove('open')}
function renderSettings(){document.getElementById('column-list').innerHTML=colOrder.map(x=>`<div class="column-setting" draggable="true" ondragstart="dragged='${x}'" ondragover="event.preventDefault()" ondrop="dropCol('${x}')"><span class="drag">⋮⋮</span><label><input type="checkbox" ${hidden.has(x)?'':'checked'} onchange="toggleCol('${x}',this.checked)"> ${defs[x][0]}</label><button onclick="moveCol('${x}',-1)">↑</button><button onclick="moveCol('${x}',1)">↓</button></div>`).join('')}
function toggleCol(x,v){v?hidden.delete(x):hidden.add(x);save();rerender();renderSettings()}function moveCol(x,d){let a=colOrder.indexOf(x),b=Math.max(0,Math.min(colOrder.length-1,a+d));if(a===b)return;colOrder.splice(a,1);colOrder.splice(b,0,x);save();rerender();renderSettings()}function dropCol(x){if(!dragged||dragged===x)return;let a=colOrder.indexOf(dragged),b=colOrder.indexOf(x);colOrder.splice(a,1);colOrder.splice(b,0,dragged);save();rerender();renderSettings()}function resetColumns(){colOrder=[...defaults];hidden.clear();save();rerender();renderSettings();toast('Поля возвращены к стандартному виду')}rerender();

<script>
function showImagePreview(event,image){const preview=document.getElementById('image-preview');preview.src=image.src;preview.classList.add('show');moveImagePreview(event)}
function moveImagePreview(event){const preview=document.getElementById('image-preview');if(!preview.classList.contains('show'))return;const gap=18,requested=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--preview-width'))||600,w=Math.min(requested,window.innerWidth-32),ratio=preview.naturalWidth?preview.naturalHeight/preview.naturalWidth:1.4,h=Math.min(window.innerHeight-32,w*ratio);let left=event.clientX+gap,top=event.clientY+gap;if(left+w>window.innerWidth-12)left=event.clientX-w-gap;if(top+h>window.innerHeight-12)top=Math.max(12,window.innerHeight-h-12);preview.style.left=Math.max(12,left)+'px';preview.style.top=Math.max(12,top)+'px'}
function hideImagePreview(){document.getElementById('image-preview').classList.remove('show')}function setPreviewWidth(value){const width=Math.max(200,Math.min(1200,parseInt(value)||600));document.documentElement.style.setProperty('--preview-width',width+'px');localStorage.setItem('yo-order-preview-width',String(width));const input=document.getElementById('preview-width');if(input&&document.activeElement!==input)input.value=width}setPreviewWidth(localStorage.getItem('yo-order-preview-width')||600)

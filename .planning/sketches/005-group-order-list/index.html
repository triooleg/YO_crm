<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Групповой заказ в списке — прототип</title><link rel="stylesheet" href="../themes/default.css"><style>
*{box-sizing:border-box}body{margin:0;padding:58px 16px 30px;background:var(--color-bg);color:var(--color-text);font:13px var(--font-sans)}button{font:inherit;cursor:pointer}.tabs{position:fixed;z-index:20;inset:0 0 auto;display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--color-border);background:#fff}.tabs button{padding:9px 13px;border:1px solid var(--color-border);border-radius:8px;background:#fff}.tabs .active{border-color:var(--color-primary);background:var(--color-accent);color:var(--color-primary);font-weight:800}.variant{display:none}.variant.active{display:block}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.head h1{margin:3px 0;font-size:28px}.head small{color:var(--color-primary);font-weight:900}.primary{padding:10px 14px;border:0;border-radius:9px;background:var(--color-primary);color:#fff;font-weight:800}.stats{display:flex;margin-bottom:8px;overflow:hidden;border:1px solid var(--color-border);border-radius:10px;background:#fff}.stats span{flex:1;padding:8px 12px;border-right:1px solid var(--color-border)}.stats b{margin-left:6px;font-size:16px}.filters{display:flex;gap:7px;margin-bottom:8px}.filters input{flex:1;padding:9px;border:1px solid var(--color-border);border-radius:8px}.filters button{padding:8px 10px;border:1px solid var(--color-border);border-radius:8px;background:#fff}.table{overflow:auto;border:1px solid var(--color-border);border-radius:12px;background:#fff}.row{display:grid;grid-template-columns:48px minmax(210px,1.25fr) minmax(145px,.8fr) 100px 155px 160px 135px 130px 36px;align-items:center;min-width:1250px;min-height:66px;border-top:1px solid var(--color-border)}.row:first-child{border-top:0}.header{min-height:34px;background:#faf8fb;color:var(--color-text-muted);font-size:10px;font-weight:800;text-transform:uppercase}.cell{padding:7px 9px}.control{display:flex;align-items:center;gap:5px}.arrow{border:0;background:transparent;color:var(--color-primary);font-size:22px}.model{display:flex;align-items:center;gap:9px}.photos{display:flex;min-width:60px}.photo{width:38px;height:50px;border:2px solid #fff;border-radius:7px;background:linear-gradient(145deg,#ef4b7a,#5f35ca);box-shadow:0 1px 4px #0002}.photo+ .photo{margin-left:-15px;background:linear-gradient(145deg,#e5af3b,#1e7a75)}.photo:nth-child(3){background:linear-gradient(145deg,#ef7b4b,#7d2a8f)}.model strong,.cell small{display:block}.cell small{margin-top:3px;color:var(--color-text-muted)}.tag{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--color-accent);color:var(--color-primary);font-size:10px;font-weight:800}.warn{background:#fff0d2;color:#985a05}.good{background:#dff5e8;color:#187044}.bad{background:#ffe2e2;color:#a93434}.money b{display:block}.people{display:flex;align-items:center}.avatar{display:grid;place-items:center;width:27px;height:27px;border:2px solid #fff;border-radius:50%;background:var(--color-accent);color:var(--color-primary);font-size:9px;font-weight:800}.avatar+.avatar{margin-left:-7px}.more{margin-left:5px;color:var(--color-text-muted);font-size:11px}.menu{border:0;background:transparent;font-size:20px}.group-row{background:#fcfaff}.group-row:hover{background:#f7f1ff}.expanded{display:none;min-width:1250px;padding:10px 48px;background:#faf7fd;border-top:1px solid var(--color-border)}.expanded.open{display:block}.composition{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.person{padding:8px;border:1px solid var(--color-border);border-radius:8px;background:#fff}.person b,.person small{display:block}.person small{margin-top:3px;color:var(--color-text-muted)}.attention{margin-bottom:8px;padding:8px;border-radius:7px;background:#fff3da;color:#87520a}.tall{min-height:92px}.tall .photos{min-width:75px}.tall .photo{width:44px;height:58px}.names{display:grid;gap:3px}.names span{display:flex;justify-content:space-between}.toast{position:fixed;right:18px;bottom:18px;padding:10px 14px;border-radius:8px;background:#211a2d;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:800px){body{padding-left:8px;padding-right:8px}.stats{display:grid;grid-template-columns:1fr 1fr}.composition{grid-template-columns:1fr 1fr}}</style></head><body>
<nav class="tabs"><button class="active" data-v="a">A: Сводная строка ★</button><button data-v="b">B: Мини-состав</button><button data-v="c">C: Раскрытие состава</button></nav><div class="head"><div><small>РАБОТА С ЗАКАЗАМИ</small><h1>Заказы</h1></div><button class="primary act">+ Новый заказ</button></div><div class="stats"><span>Активные <b>28</b></span><span>Групповые <b>4</b></span><span>Нужны замеры <b>7</b></span><span>Просрочены <b>2</b></span></div><div class="filters"><input placeholder="Номер, клиент, команда…"><button>Все 32</button><button>Групповые 4</button><button>Без замеров 7</button></div>
<div id="a" class="variant active"></div><div id="b" class="variant"></div><div id="c" class="variant"></div><div class="toast" id="toast">Карточка заказа открыта</div>
<script>
const head=`<div class="row header"><div></div><div class="cell">Заказ / модель</div><div class="cell">Клиент / состав</div><div class="cell">Тип</div><div class="cell">Замеры</div><div class="cell">Срок</div><div class="cell">Оплата</div><div class="cell">Производство</div><div></div></div>`;
function regular(){return `<div class="row"><div class="cell control"><button class="arrow act">›</button><input type="checkbox"></div><div class="cell model"><div class="photos"><i class="photo"></i></div><div><strong>YO-2026-0019</strong><small>Красный купальник</small></div></div><div class="cell"><b>Claire Martin</b><small>Emma Martin</small></div><div class="cell"><span class="tag">Индивидуальный</span></div><div class="cell"><span class="tag good">Готовы</span></div><div class="cell"><b>28 сентября</b><small>Через 52 дня</small></div><div class="cell money"><b>400 €</b><small>Остаток 200 €</small></div><div class="cell"><span class="tag">Ожидает</span></div><button class="menu act">⋯</button></div>`}
function group(mode){const people=mode==='b'?`<div class="names"><span>Anna Petrova <b>1 шт.</b></span><span>Maria Petrova <b>1 шт.</b></span><span>Olga Ivanova <b>1 шт.</b></span><small>+ ещё 7 спортсменов</small></div>`:`<div class="people"><i class="avatar">AP</i><i class="avatar">MP</i><i class="avatar">OI</i><i class="avatar">SM</i><span class="more">+6</span></div><small>10 спортсменов · 12 изделий</small>`;return `<div class="row group-row ${mode==='b'?'tall':''}"><div class="cell control"><button class="arrow ${mode==='c'?'toggle':'act'}">›</button><input type="checkbox"></div><div class="cell model"><div class="photos"><i class="photo"></i><i class="photo"></i><i class="photo"></i></div><div><strong>YO-2026-0022</strong><small>Команда «Aurora» · 3 модели</small></div></div><div class="cell">${people}</div><div class="cell"><span class="tag">Групповой</span><small>12 изделий</small></div><div class="cell"><span class="tag warn">8 из 10 готовы</span><small>2 требуют внимания</small></div><div class="cell"><b>15 октября</b><small>Общий срок</small></div><div class="cell money"><b>4 200 €</b><small>Остаток 2 100 €</small></div><div class="cell"><span class="tag warn">8 можно запускать</span></div><button class="menu act">⋯</button></div>${mode==='c'?details():''}`}
function details(){return `<div class="expanded"><div class="attention"><b>Требуют внимания:</b> Olga Ivanova — нет замеров; Lina Moreau — отсутствует №15.</div><div class="composition">${[['Anna Petrova','Модель A','Готовы'],['Maria Petrova','Модель A','Готовы'],['Olga Ivanova','Модель B','Нет замеров'],['Sofia Martin','Модель A · 2 шт.','Готовы'],['Lina Moreau','Модель A','Нет №15']].map(p=>`<div class="person"><b>${p[0]}</b><small>${p[1]}</small><span class="tag ${p[2]==='Готовы'?'good':'bad'}">${p[2]}</span></div>`).join('')}</div></div>`}
a.innerHTML=`<div class="table">${head}${group('a')}${regular()}${regular()}</div>`;b.innerHTML=`<div class="table">${head}${group('b')}${regular()}${regular()}</div>`;c.innerHTML=`<div class="table">${head}${group('c')}${regular()}${regular()}</div>`;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.variant').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.v).classList.add('active')});document.addEventListener('click',e=>{if(e.target.classList.contains('toggle')){const d=e.target.closest('.row').nextElementSibling;d.classList.toggle('open');e.target.textContent=d.classList.contains('open')?'⌄':'›'}if(e.target.classList.contains('act')){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000)}});
</script></body></html>

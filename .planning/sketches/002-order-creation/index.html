<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создание заказа — варианты</title><link rel="stylesheet" href="../themes/default.css"><style>
*{box-sizing:border-box}body{margin:0;padding-top:58px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans)}button,input,select{font:inherit}button{cursor:pointer}.tabs{position:fixed;z-index:20;inset:0 0 auto;display:flex;gap:8px;padding:9px 16px;border-bottom:1px solid var(--color-border);background:#fff}.tabs button{padding:10px 14px;border:0;border-radius:8px;background:#f3f0f5}.tabs button.active,.primary{background:var(--color-primary);color:#fff}.variant{display:none}.variant.active{display:block}.app{min-height:calc(100vh - 58px);display:grid;grid-template-columns:64px 220px 1fr}.nav{padding:16px 11px;border-right:1px solid var(--color-border);background:#fff}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--color-primary);color:#fff;font-weight:800}.clients{border-right:1px solid var(--color-border);background:#fff}.search{width:calc(100% - 24px);margin:12px;padding:9px;border:1px solid var(--color-border);border-radius:8px}.client{padding:13px;border-top:1px solid #f0ecf2}.client.active{background:#f0eaff}.client small,.muted{display:block;color:var(--color-text-muted)}.main{padding:25px}.card,.page-form{max-width:1080px;margin:auto;border:1px solid var(--color-border);border-radius:16px;background:#fff;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:21px 24px;border-bottom:1px solid var(--color-border)}h1,h2{margin:0}.primary{padding:10px 15px;border:0;border-radius:9px;font-weight:700}.content{padding:22px 24px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{padding:13px;border-radius:10px;background:#faf8fb}.section-title{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.order{display:flex;justify-content:space-between;margin-top:18px;padding:15px;border:1px solid var(--color-border);border-radius:11px}.order-with-image{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:12px}.order-thumb{width:58px;height:68px;overflow:hidden;border-radius:8px;background:#f2edf6}.order-thumb svg,.order-thumb img{width:100%;height:100%;object-fit:cover}.order-main{display:grid;gap:4px}.order-main span,.order-main small{color:var(--color-text-muted)}.order-status{padding:6px 9px;border-radius:99px;background:#f0eaff;color:#7047eb;font-size:12px;font-weight:700}.drawer,.wizard-wrap{position:fixed;z-index:15;inset:58px 0 0;background:#211a2d66;opacity:0;pointer-events:none;transition:.2s}.drawer.open,.wizard-wrap.open{opacity:1;pointer-events:auto}.panel{position:absolute;right:0;width:min(540px,100%);height:100%;display:grid;grid-template-rows:auto 1fr auto;background:#fff;transform:translateX(100%);transition:.2s}.drawer.open .panel{transform:none}.panel header,.panel footer,.wizard header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--color-border)}.close{border:0;background:transparent;font-size:25px}.scroll{overflow:auto;padding:18px 22px}.section{margin:0 0 18px;padding:14px;border:1px solid var(--color-border);border-radius:11px}.section h3{margin:0 0 11px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;font-size:12px;font-weight:650}.field input,.field select{min-width:0;padding:9px;border:1px solid #ddd5e4;border-radius:8px;background:#fff}.wide{grid-column:1/-1}.model-upload{display:grid;grid-template-columns:100px 1fr;gap:13px;align-items:center;padding:12px;border:1px dashed #cfc3df;border-radius:10px;background:#fcfaff}.model-preview{display:grid;place-items:center;height:120px;overflow:hidden;border-radius:8px;background:#f2edf6}.model-preview img,.model-preview svg{width:100%;height:100%;object-fit:cover}.model-upload p{margin:4px 0 9px;color:var(--color-text-muted);font-size:12px}.upload-button{display:inline-block;padding:7px 10px;border-radius:7px;background:var(--color-primary);color:#fff;font-size:12px;font-weight:700}.upload-button input{display:none}.remove-photo{margin-left:5px;padding:6px 8px;border:1px solid var(--color-border);border-radius:7px;background:#fff;font-size:12px}.file-name{display:block;margin-top:7px;color:var(--color-text-muted)}.snapshot{padding:10px;border-radius:8px;background:#eaf8f0;color:#257147}.money{display:grid;grid-template-columns:1fr 100px;gap:8px}.summary{padding:13px;border-radius:10px;background:#f0eaff}.panel footer{justify-content:flex-end;gap:9px}.secondary{padding:9px 14px;border:1px solid var(--color-border);border-radius:9px;background:#fff}.page-form{padding-bottom:22px}.page-form .form-body{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:22px}.page-form .section{margin:0}.page-actions{display:flex;justify-content:flex-end;gap:9px;padding:0 22px}.wizard{width:min(570px,calc(100% - 30px));margin:8vh auto;padding-bottom:20px;border-radius:16px;background:#fff}.wizard-body{padding:22px}.steps{display:flex;gap:7px;margin-bottom:20px}.steps i{height:5px;flex:1;border-radius:5px;background:#e7e1eb}.steps i.on{background:var(--color-primary)}.step2{display:none}.toast{position:fixed;z-index:30;bottom:22px;left:50%;padding:11px 16px;border-radius:8px;background:#211a2d;color:#fff;transform:translate(-50%,100px);transition:.2s}.toast.show{transform:translate(-50%,0)}@media(max-width:760px){.app{grid-template-columns:60px 1fr}.clients{display:none}.main{padding:12px}.facts,.grid,.page-form .form-body{grid-template-columns:1fr}.tabs{overflow:auto}.tabs button{white-space:nowrap}}
</style></head><body><nav class="tabs"><button class="active" onclick="variant('a',this)">A: Боковая панель ★ Выбрано</button><button onclick="variant('b',this)">B: Отдельная страница</button><button onclick="variant('c',this)">C: По шагам</button></nav>
<div id="a" class="variant active"><AppShell mode="drawer"></AppShell></div><div id="b" class="variant"><AppShell mode="page"></AppShell></div><div id="c" class="variant"><AppShell mode="wizard"></AppShell></div>
<template id="shell"><div class="app"><aside class="nav"><div class="logo">Y</div></aside><aside class="clients"><input class="search" placeholder="Поиск клиентов…"><div class="client active"><b>Анна Коваленко</b><small>Instagram · Украина</small></div><div class="client"><b>Мария Соколова</b><small>WhatsApp · Польша</small></div></aside><main class="main"><article class="card"><header class="head"><div><small class="muted">КАРТОЧКА КЛИЕНТА</small><h1>Анна Коваленко</h1></div><button class="primary create">+ Новый заказ</button></header><div class="content"><div class="facts"><div class="fact"><small>Спортсмен</small><b>Анна Коваленко</b></div><div class="fact"><small>Замеры</small><b>7 августа 2026</b></div><div class="fact"><small>Ближайший стандарт</small><b>Рост 152</b></div></div><div class="section-title"><b>Заказы клиента</b><span class="muted">1 заказ</span></div><div class="order order-with-image"><div class="order-thumb"><svg viewBox="0 0 120 150"><path d="M44 19L33 35 18 48l11 14 12-9v72h38V53l12 9 11-14-15-13-11-16-16 9z" fill="#eadfff" stroke="#7047eb" stroke-width="3"/><path d="M42 76c15-15 28-12 39-27M41 95c18-6 29-1 39 12" fill="none" stroke="#a16ae8" stroke-width="5"/></svg></div><div class="order-main"><b>YO-2026-001 · Индивидуальный купальник</b><span>Анна Коваленко · 450 EUR</span><small>Получить до 15 октября 2026</small></div><span class="order-status">Новый заказ</span></div></div></article></main></div></template>
<template id="form"><section class="section"><h3>1. Изделие и спортсмен</h3><div class="grid"><label class="field">Тип заказа<select><option>Индивидуальный заказ</option><option>Готовая модель</option><option>Копия модели</option><option>Групповой заказ</option></select></label><label class="field">Спортсмен<select><option>Анна Коваленко</option></select></label><label class="field wide">Описание изделия<input value="Купальник для художественной гимнастики"></label><div class="model-upload wide"><div class="model-preview"><svg viewBox="0 0 120 150" aria-label="Предпросмотр модели"><path d="M44 19L33 35 18 48l11 14 12-9v72h38V53l12 9 11-14-15-13-11-16-16 9z" fill="#eadfff" stroke="#7047eb" stroke-width="3"/><path d="M42 76c15-15 28-12 39-27M41 95c18-6 29-1 39 12" fill="none" stroke="#a16ae8" stroke-width="5"/></svg></div><div><b>Изображение модели *</b><p>Главное фото будет видно в списке заказов и на производстве.</p><label class="upload-button">Выбрать изображение<input class="model-file" type="file" accept="image/png,image/jpeg,image/webp" required></label><button class="remove-photo" type="button">Удалить</button><small class="file-name">Пример модели · изображение ещё не выбрано</small></div></div><div class="snapshot wide">✓ Замеры от 7 августа 2026 · ближайший рост 152</div></div></section><section class="section"><h3>2. Срок и стоимость</h3><div class="grid"><label class="field">Требуется получить до<input type="date" value="2026-10-15"></label><label class="field">Приоритет<select><option>Обычный</option><option>Срочный</option></select></label><label class="field">Цена<div class="money"><input id="price" type="number" value="450"><select><option>EUR</option><option>USD</option><option>UAH</option></select></div></label><label class="field">Предоплата<input id="deposit" type="number" value="225"></label></div></section><section class="summary"><b>К созданию:</b> индивидуальный заказ · 450 EUR · предоплата 225 EUR<br><small>Продажа: новый заказ · Оплата: не оплачено · Производство: не запланировано</small></section></template>
<div class="drawer" id="drawer"><form class="panel" onsubmit="save(event)"><header><div><small class="muted">АННА КОВАЛЕНКО</small><h2>Новый заказ</h2></div><button class="close" type="button" onclick="closeAll()">×</button></header><div class="scroll"><OrderForm></OrderForm></div><footer><button class="secondary" type="button" onclick="closeAll()">Отмена</button><button class="primary">Создать заказ</button></footer></form></div>
<div class="wizard-wrap" id="wizard"><form class="wizard" onsubmit="save(event)"><header><h2>Новый заказ</h2><button class="close" type="button" onclick="closeAll()">×</button></header><div class="wizard-body"><div class="steps"><i class="on"></i><i id="bar2"></i></div><div id="step1"><h3>Изделие и спортсмен</h3><OrderForm></OrderForm><button class="primary" type="button" onclick="next()">Далее</button></div><div class="step2" id="step2"><h3>Проверка заказа</h3><p>Анна Коваленко · индивидуальный заказ</p><p>Срок: 15 октября 2026</p><p>Цена: 450 EUR · предоплата: 225 EUR</p><button class="secondary" type="button" onclick="back()">Назад</button> <button class="primary">Создать заказ</button></div></div></form></div><div class="toast" id="toast">Заказ создан и добавлен в историю клиента</div>
<script>
class AppShell extends HTMLElement{connectedCallback(){const n=document.getElementById('shell').content.cloneNode(true),m=this.getAttribute('mode');const b=n.querySelector('.create');if(m==='page'){b.textContent='Редактировать';n.querySelector('.main').innerHTML=`<form class="page-form" onsubmit="save(event)"><header class="head"><h1>Новый заказ · Анна Коваленко</h1></header><div class="form-body"><OrderForm></OrderForm></div><div class="page-actions"><button class="secondary">Отмена</button><button class="primary">Создать заказ</button></div></form>`}else b.onclick=()=>document.getElementById(m).classList.add('open');this.replaceWith(n)}}class OrderForm extends HTMLElement{connectedCallback(){this.replaceWith(document.getElementById('form').content.cloneNode(true))}}customElements.define('app-shell',AppShell);customElements.define('order-form',OrderForm);document.querySelectorAll('AppShell').forEach(x=>{const n=document.createElement('app-shell');n.setAttribute('mode',x.getAttribute('mode'));x.replaceWith(n)});document.querySelectorAll('OrderForm').forEach(x=>x.replaceWith(document.createElement('order-form')));function variant(id,b){document.querySelectorAll('.variant').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function closeAll(){drawer.classList.remove('open');wizard.classList.remove('open')}function next(){step1.style.display='none';step2.style.display='block';bar2.classList.add('on')}function back(){step1.style.display='block';step2.style.display='none';bar2.classList.remove('on')}function save(e){e.preventDefault();closeAll();toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
document.addEventListener('change',e=>{if(!e.target.matches('.model-file')||!e.target.files[0])return;const box=e.target.closest('.model-upload'),reader=new FileReader();reader.onload=()=>{box.querySelector('.model-preview').innerHTML=`<img src="${reader.result}" alt="Модель заказа">`;box.querySelector('.file-name').textContent=e.target.files[0].name};reader.readAsDataURL(e.target.files[0])});document.addEventListener('click',e=>{if(!e.target.matches('.remove-photo'))return;const box=e.target.closest('.model-upload');box.querySelector('.model-file').value='';box.querySelector('.file-name').textContent='Изображение удалено'});</script></body></html>

name: yoleotard-crm
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yoleotard_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-yoleotard_crm}
    ports:
      - "5434:5432"
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yoleotard_crm} -d ${POSTGRES_DB:-yoleotard_crm}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    volumes:
      - crm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    extra_hosts:
      - "chatwoot.yoleotard.com:${CHATWOOT_HOST_IP:-192.168.31.219}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yoleotard_crm}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-yoleotard_crm}?schema=public
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-local-settings-encryption-key-change-me}
      REDIS_URL: redis://redis:6379
      API_PORT: 4500
      UPLOADS_DIR: /app/uploads
      BACKUP_STORAGE_PATH: /backups
      ALLOW_RESTORE: ${ALLOW_RESTORE:-false}
    ports: ["${API_PUBLIC_PORT:-4500}:4500"]
    volumes:
      - crm_uploads:/app/uploads
      - ${BACKUP_STORAGE_PATH:-./.local/backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:4500/api/health | grep -q ''"ok":true''',
        ]
      interval: 15s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        {
          NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4500/api}",
          CRM_VERSION: "${CRM_VERSION:-0.4.0}",
          CRM_COMMIT: "${CRM_COMMIT:-development}",
        }
    ports: ["${WEB_PUBLIC_PORT:-3500}:3500"]
    depends_on: [api]
volumes:
  crm_postgres:
  crm_redis:
  crm_uploads:
